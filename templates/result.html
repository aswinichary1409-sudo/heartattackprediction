<style>
.risk-container {
    width: 60%;
    margin: auto;
    text-align: center;
    padding: 20px;
}

.progress {
    width: 100%;
    height: 25px;
    background: #e0e0e0;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: green;
    transition: width 1s ease-in-out;
}

.recommendation-box {
    width: 80%;
    margin: 24px auto 0 auto;
    padding: 24px;
    border-radius: 20px;
    background: rgba(24, 24, 27, 0.4);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 15px;
    line-height: 1.6;
    color: #e4e4e7;
}

.recommendation-box h3 {
    text-align: center;
    color: #ffffff;
    font-weight: 700;
    margin-bottom: 16px;
    font-size: 16px;
    letter-spacing: 0.5px;
}

pre {
    white-space: pre-wrap;
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    color: #e4e4e7;
}
</style>

<h1>Prediction Result</h1>

{% if prediction == 1 %}
    <h2>⚠ High Heart Disease Risk</h2>
{% else %}
    <h2>✅ Low Heart Disease Risk</h2>
{% endif %}

<div class="risk-container">
    <h3>Your Heart Risk Level</h3>
    <div class="progress">
        <div id="riskBar" class="progress-bar"></div>
    </div>
    <h4 id="riskText"></h4>
</div>

<div class="recommendation-box">
    <h3>AI Health Recommendation & Diet Plan</h3>
    <pre>{{ recommendation }}</pre>
</div>

<script>
    let risk = {{ risk|default(0) }};

    let bar = document.getElementById("riskBar");
    let text = document.getElementById("riskText");

    bar.style.width = risk + "%";

    if (risk < 30) {
        bar.style.background = "green";
        text.innerHTML = "Low Risk ❤️";
    }
    else if (risk < 70) {
        bar.style.background = "orange";
        text.innerHTML = "Medium Risk ⚠️";
    }
    else {
        bar.style.background = "red";
        text.innerHTML = "High Risk 🚨";
    }
</script>
