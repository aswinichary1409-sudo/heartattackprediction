<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardimars // Authenticate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0D0D0D;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-neutral-200 min-h-screen flex items-center justify-center relative p-4">
    <!-- Animated background aura rings -->
    <div class="absolute w-[450px] h-[450px] border border-neutral-900 rounded-full animate-ping opacity-10 pointer-events-none"></div>
    <div class="absolute w-[600px] h-[600px] border border-neutral-900/50 rounded-full pointer-events-none"></div>

    <div class="w-full max-w-md z-10">
        <!-- Brand logo header -->
        <div class="text-center mb-8">
            <h1 class="text-white font-bold text-4xl tracking-tight mb-2">Cardimars&reg;</h1>
            <p class="text-neutral-500 text-sm tracking-wide">Heartbeat Monitoring Web Ecosystem</p>
        </div>

        <!-- Glassmorphic Auth Card -->
        <div class="glass-card rounded-[32px] p-8 shadow-2xl relative overflow-hidden">
            <!-- Tabs header -->
            <div class="flex bg-neutral-950 p-1.5 rounded-2xl mb-6 border border-neutral-900">
                <button type="button" id="tab-login" class="flex-1 py-3 text-sm font-semibold rounded-xl transition-all cursor-pointer text-center" onclick="setMode('login')">Sign In</button>
                <button type="button" id="tab-signup" class="flex-1 py-3 text-sm font-semibold rounded-xl transition-all cursor-pointer text-center" onclick="setMode('signup')">Create Account</button>
            </div>

            <!-- Error Banner -->
            {% if error %}
            <div class="bg-red-500/10 border border-red-500/20 text-[#E64A4A] px-4 py-3.5 rounded-2xl text-xs font-medium mb-6 flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-sm"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Auth Form -->
            <form action="/login" method="POST" id="auth-form" class="space-y-5">
                <input type="hidden" name="action" id="action-field" value="{{ mode or 'login' }}">

                <!-- Username (Email) -->
                <div class="space-y-2">
                    <label for="username" class="text-xs font-bold text-neutral-400 tracking-wide uppercase" id="username-label">Email or Username</label>
                    <input type="text" id="username" name="username" class="w-full px-5 py-4 bg-neutral-900/50 border border-neutral-800 focus:border-[#E64A4A] focus:ring-1 focus:ring-[#E64A4A] rounded-2xl text-white text-sm focus:outline-none transition-all placeholder-neutral-600" placeholder="e.g. name@domain.com" required>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label for="password" class="text-xs font-bold text-neutral-400 tracking-wide uppercase">Password</label>
                    <input type="password" id="password" name="password" class="w-full px-5 py-4 bg-neutral-900/50 border border-neutral-800 focus:border-[#E64A4A] focus:ring-1 focus:ring-[#E64A4A] rounded-2xl text-white text-sm focus:outline-none transition-all placeholder-neutral-600" placeholder="••••••••" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-[#E64A4A] text-white py-4 rounded-full font-semibold tracking-wide hover:bg-[#d63f3f] transition-all transform active:scale-95 shadow-lg shadow-[#E64A4A]/20 mt-6" id="submit-btn">
                    Sign In to Dashboard
                </button>
            </form>

            <div class="text-center text-xs text-neutral-500 mt-6 tracking-wide" id="auth-footer">
                {% if mode == 'signup' %}
                Already have an account? <a href="#" class="text-[#E64A4A] font-semibold ml-1 hover:underline" onclick="setMode('login')">Sign In</a>
                {% else %}
                New to Cardimars? <a href="#" class="text-[#E64A4A] font-semibold ml-1 hover:underline" onclick="setMode('signup')">Create Account</a>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
        function setMode(mode) {
            document.getElementById('action-field').value = mode;
            
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('submit-btn');
            const footerText = document.getElementById('auth-footer');

            if (mode === 'login') {
                tabLogin.classList.add('bg-neutral-900', 'text-white');
                tabLogin.classList.remove('text-neutral-500');
                tabSignup.classList.remove('bg-neutral-900', 'text-white');
                tabSignup.classList.add('text-neutral-500');
                submitBtn.textContent = 'Sign In to Dashboard';
                footerText.innerHTML = 'New to Cardimars? <a href="#" class="text-[#E64A4A] font-semibold ml-1 hover:underline" onclick="setMode(\'signup\')">Create Account</a>';
            } else {
                tabLogin.classList.remove('bg-neutral-900', 'text-white');
                tabLogin.classList.add('text-neutral-500');
                tabSignup.classList.add('bg-neutral-900', 'text-white');
                tabSignup.classList.remove('text-neutral-500');
                submitBtn.textContent = 'Create Account & Sign Up';
                footerText.innerHTML = 'Already have an account? <a href="#" class="text-[#E64A4A] font-semibold ml-1 hover:underline" onclick="setMode(\'login\')">Sign In</a>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentMode = document.getElementById('action-field').value;
            setMode(currentMode);
        });
    </script>
</body>
</html>
